<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Warna Benang</title>
  <meta name="theme-color" content="#f6f1e9">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <!-- Tailwind via CDN (tanpa npm/build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-serif: "Fraunces", ui-serif, Georgia, serif;
      --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;

      --color-oat-50: #fdfbf7;
      --color-oat-100: #f6f1e9;
      --color-ink: #2b2420;
      --color-ink-soft: #776c63;
      --color-clay: #b4532a;

      --animate-pop: pop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      @keyframes pop {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
      }
    }

    @layer base {
      /* Kunci scroll halaman saat popup terbuka */
      html:has(dialog[open]) { overflow: hidden; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }
    }
  </style>

  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="bg-oat-100 font-sans text-ink antialiased selection:bg-ink selection:text-oat-50">

  <!-- Hero -->
  <header class="mx-auto max-w-7xl px-4 pt-6 pb-5 sm:px-6 sm:pt-8 lg:px-8">
    <h1 class="text-xs font-semibold tracking-[0.25em] text-clay uppercase">Katalog Benang</h1>

    <!-- Pita semua warna (diisi JS), klik untuk detail -->
    <div id="ribbon" class="mt-1 flex h-12 items-end gap-px sm:h-16 sm:gap-[3px]" aria-label="Semua warna"></div>
  </header>

  <!-- Toolbar -->
  <!-- Desktop: 1 baris (cari · urut · chip palet). Mobile: 2 baris, chip bisa digeser. -->
  <div id="toolbar" class="sticky top-0 z-20 border-y border-ink/5 bg-oat-100/85 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-4 py-2 sm:px-6 lg:flex-nowrap lg:px-8">
      <label class="relative min-w-0 flex-1 lg:w-60 lg:flex-none">
        <span class="sr-only">Cari warna</span>
        <svg class="pointer-events-none absolute top-1/2 left-3.5 size-3.5 -translate-y-1/2 text-ink-soft" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="9" cy="9" r="6"/><path d="m17 17-3.5-3.5"/>
        </svg>
        <input id="search" type="search" autocomplete="off" placeholder="Cari nama / nomor…"
          class="w-full rounded-full bg-white py-1.5 pr-14 pl-9 text-[13px] shadow-sm ring-1 ring-ink/10 transition placeholder:text-ink-soft/70 focus:ring-2 focus:ring-ink/30 focus:outline-none">
        <span id="count" aria-live="polite" class="pointer-events-none absolute top-1/2 right-3.5 -translate-y-1/2 text-[11px] text-ink-soft tabular-nums"></span>
      </label>

      <div id="sort" role="radiogroup" aria-label="Urutkan" class="flex shrink-0 rounded-full bg-white p-0.5 text-[13px] shadow-sm ring-1 ring-ink/10">
        <button type="button" role="radio" data-sort="palette" aria-checked="true"
          class="rounded-full px-3 py-1 font-medium text-ink-soft transition hover:text-ink aria-checked:bg-ink aria-checked:text-oat-50">Palet</button>
        <button type="button" role="radio" data-sort="number" aria-checked="false"
          class="rounded-full px-3 py-1 font-medium text-ink-soft transition hover:text-ink aria-checked:bg-ink aria-checked:text-oat-50">Nomor</button>
      </div>

      <span class="hidden h-5 w-px shrink-0 bg-ink/10 lg:block" aria-hidden="true"></span>

      <!-- Chip palet: bisa digeser (panah, roda mouse, swipe) -->
      <div class="relative -mx-4 basis-[calc(100%+2rem)] sm:-mx-6 sm:basis-[calc(100%+3rem)] lg:mx-0 lg:min-w-0 lg:flex-1 lg:basis-auto">
        <div id="chips" role="toolbar" aria-label="Filter palet"
          class="flex gap-1.5 overflow-x-auto px-4 py-0.5 [scrollbar-width:none] sm:px-6 lg:px-0 [&::-webkit-scrollbar]:hidden"></div>

        <button id="chips-prev" type="button" aria-label="Geser palet ke kiri" hidden
          class="absolute inset-y-0 left-0 flex w-14 items-center bg-linear-to-r from-oat-100 from-50% to-transparent pl-1">
          <span class="grid size-7 place-items-center rounded-full bg-white text-ink shadow-sm ring-1 ring-ink/10 transition hover:ring-ink/30">
            <svg class="size-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg>
          </span>
        </button>
        <button id="chips-next" type="button" aria-label="Geser palet ke kanan" hidden
          class="absolute inset-y-0 right-0 flex w-14 items-center justify-end bg-linear-to-l from-oat-100 from-50% to-transparent pr-1">
          <span class="grid size-7 place-items-center rounded-full bg-white text-ink shadow-sm ring-1 ring-ink/10 transition hover:ring-ink/30">
            <svg class="size-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg>
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- Grid (section diisi JS) -->
  <main id="main" class="mx-auto max-w-7xl px-4 pb-24 sm:px-6 lg:px-8">
    <div id="empty" hidden class="py-28 text-center">
      <p class="font-serif text-3xl font-medium">Warna tidak ditemukan</p>
      <p class="mt-2 text-ink-soft">Coba kata kunci lain, atau lihat semua palet.</p>
      <button id="reset" type="button" class="mt-6 rounded-full bg-ink px-5 py-2.5 text-sm font-semibold text-oat-50 transition hover:bg-ink/85">Tampilkan semua</button>
    </div>
  </main>

  <footer class="border-t border-ink/10 py-10 text-center text-sm text-ink-soft">
    Klik sebuah warna untuk melihat detail &amp; warna senada.
  </footer>

  <!-- Popup detail -->
  <dialog id="modal" aria-labelledby="modal-name"
    class="m-auto max-h-[calc(100dvh-2rem)] w-[min(60rem,calc(100%-2rem))] overflow-y-auto rounded-[2rem] bg-oat-50 p-0 text-ink shadow-2xl backdrop:bg-ink/50 backdrop:backdrop-blur-sm open:animate-pop">
    <div class="grid md:grid-cols-2">
      <div class="relative aspect-4/3 bg-(--c)/20 md:aspect-auto md:min-h-[32rem]">
        <img id="modal-img" alt="" width="1024" height="1024" class="absolute inset-0 size-full object-cover object-[50%_35%]">
      </div>

      <div class="flex flex-col p-6 sm:p-8">
        <div class="flex items-start justify-between gap-4">
          <p id="modal-fam" class="text-xs font-semibold tracking-[0.25em] text-clay uppercase"></p>
          <button id="modal-close" type="button" aria-label="Tutup"
            class="-mt-2 -mr-2 rounded-full p-2 text-ink-soft transition hover:bg-ink/5 hover:text-ink">
            <svg class="size-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
          </button>
        </div>

        <h2 id="modal-name" class="mt-3 font-serif text-4xl leading-tight font-medium tracking-tight capitalize sm:text-5xl"></h2>
        <p class="mt-2 flex flex-wrap items-center gap-2 text-ink-soft">
          <span id="modal-num" class="tabular-nums"></span>
          <span id="modal-stock" hidden class="rounded-full bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 ring-1 ring-red-200">Stok habis</span>
        </p>

        <div class="mt-6 flex items-center gap-4 rounded-2xl bg-white p-3 ring-1 ring-ink/5">
          <span class="size-12 shrink-0 rounded-xl bg-(--c) ring-1 ring-black/10 ring-inset"></span>
          <div>
            <p class="text-xs text-ink-soft">Kode warna (perkiraan dari foto)</p>
            <p id="modal-hex" class="font-mono text-sm font-semibold uppercase"></p>
          </div>
          <button id="copy" type="button" class="ml-auto rounded-full bg-ink px-4 py-2 text-xs font-semibold text-oat-50 transition hover:bg-ink/85">Salin</button>
        </div>

        <p class="mt-8 text-sm font-semibold">Warna senada</p>
        <div id="modal-related" class="mt-3 grid grid-cols-7 gap-2.5"></div>
      </div>
    </div>
  </dialog>
</body>
</html>
